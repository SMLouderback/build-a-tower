services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudsave
      POSTGRES_PASSWORD: cloudsave_dev_only
      POSTGRES_DB: cloudsave
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
