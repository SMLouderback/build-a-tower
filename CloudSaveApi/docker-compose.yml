services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    # LAN only for edge-proxy NPM. Do not publish 80/443 on this VM.
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CloudSavePostgres: Host=postgres;Port=5432;Database=cloudsave;Username=cloudsave;Password=cloudsave_dev_only
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudsave
      POSTGRES_PASSWORD: cloudsave_dev_only
      POSTGRES_DB: cloudsave
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
